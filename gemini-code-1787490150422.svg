<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
  <title id="title">SEの領域を整理する4象限</title>
  <desc id="desc">横軸をアプリとインフラ、縦軸を業務寄りと技術寄りとして、4つのSE領域を示す図。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#233746" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="900" height="760" fill="#eef3f7"/>
  <rect x="34" y="28" width="832" height="704" rx="14" fill="#f8fbfc" stroke="#d8e1e7" filter="url(#shadow)"/>

  <g font-family="Hiragino Kaku Gothic ProN, Yu Gothic, sans-serif" text-anchor="middle">
    <text x="347" y="78" fill="#334155" font-size="22" font-weight="700">［ アプリ ］</text>
    <text x="665" y="78" fill="#334155" font-size="22" font-weight="700">［ インフラ ］</text>

    <text x="91" y="284" fill="#b45309" font-size="18" font-weight="700" letter-spacing="3" transform="rotate(90 91 284)">業務寄り（顧客）</text>
    <text x="91" y="578" fill="#0f766e" font-size="18" font-weight="700" letter-spacing="3" transform="rotate(90 91 578)">技術寄り（システム）</text>

    <g>
      <rect x="137" y="100" width="316" height="278" rx="8" fill="#ffffff" stroke="#d7e1e6" stroke-width="2"/>
      <rect x="154" y="116" width="38" height="28" rx="4" fill="#1f5f65"/>
      <text x="173" y="136" fill="#ffffff" font-size="16" font-weight="700">①</text>
      <g transform="translate(279 142) scale(2.1)" fill="none" stroke="#1f5f65" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <rect x="13" y="3" width="8" height="10" rx="1"/>
      </g>
      <text x="295" y="242" fill="#172033" font-size="20" font-weight="700">アプリケーションSE</text>
      <text x="295" y="276" fill="#526273" font-size="14">
        <tspan x="295" dy="0">顧客の業務課題を捉え、必要な機能と</tspan>
        <tspan x="295" dy="22">事業価値を形にする。</tspan>
      </text>
    </g>

    <g>
      <rect x="471" y="100" width="316" height="278" rx="8" fill="#ffffff" stroke="#d7e1e6" stroke-width="2"/>
      <rect x="488" y="116" width="38" height="28" rx="4" fill="#1f5f65"/>
      <text x="507" y="136" fill="#ffffff" font-size="16" font-weight="700">③</text>
      <g transform="translate(613 142) scale(2.1)" fill="none" stroke="#1f5f65" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>
        <polyline points="8 14 11 11 14 14"/>
        <line x1="11" y1="11" x2="11" y2="17"/>
      </g>
      <text x="629" y="230" fill="#172033" font-size="20" font-weight="700">
        <tspan x="629" dy="0">ITサービス／</tspan>
        <tspan x="629" dy="28">運用設計SE</tspan>
      </text>
      <text x="629" y="300" fill="#526273" font-size="14">
        <tspan x="629" dy="0">運用プロセスを設計し、プロジェクトと</tspan>
        <tspan x="629" dy="22">サービス全体を円滑に回す。</tspan>
      </text>
    </g>

    <g>
      <rect x="137" y="394" width="316" height="278" rx="8" fill="#ffffff" stroke="#d7e1e6" stroke-width="2"/>
      <rect x="154" y="410" width="38" height="28" rx="4" fill="#1f5f65"/>
      <text x="173" y="430" fill="#ffffff" font-size="16" font-weight="700">②</text>
      <g transform="translate(279 436) scale(2.1)" fill="none" stroke="#1f5f65" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="16 18 22 12 16 6"/>
        <polyline points="8 6 2 12 8 18"/>
        <line x1="14" y1="4" x2="10" y2="20"/>
      </g>
      <text x="295" y="536" fill="#172033" font-size="20" font-weight="700">
        <tspan x="295" dy="0">アプリ／</tspan>
        <tspan x="295" dy="28">SWアーキテクト</tspan>
      </text>
      <text x="295" y="606" fill="#526273" font-size="14">
        <tspan x="295" dy="0">機能要件の実現方式と共通ルールを設計し、</tspan>
        <tspan x="295" dy="22">アプリの品質と整合性を担保する。</tspan>
      </text>
    </g>

    <g>
      <rect x="471" y="394" width="316" height="278" rx="8" fill="#ffffff" stroke="#d7e1e6" stroke-width="2"/>
      <rect x="488" y="410" width="38" height="28" rx="4" fill="#1f5f65"/>
      <text x="507" y="430" fill="#ffffff" font-size="16" font-weight="700">④</text>
      <g transform="translate(613 436) scale(2.1)" fill="none" stroke="#1f5f65" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="20" height="8" rx="2"/>
        <rect x="2" y="14" width="20" height="8" rx="2"/>
        <line x1="6" y1="6" x2="6.01" y2="6"/>
        <line x1="6" y1="18" x2="6.01" y2="18"/>
      </g>
      <text x="629" y="536" fill="#172033" font-size="20" font-weight="700">
        <tspan x="629" dy="0">インフラ／</tspan>
        <tspan x="629" dy="28">ITアーキテクト</tspan>
      </text>
      <text x="629" y="606" fill="#526273" font-size="14">
        <tspan x="629" dy="0">サーバーやクラウドの構成を設計・検証し、</tspan>
        <tspan x="629" dy="22">非機能要件を満たす。</tspan>
      </text>
    </g>
  </g>
</svg>
