<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        color: #172033;
        background: #eef3f7;
        font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      }

      body {
        margin: 0;
        padding: 32px 16px;
      }

      .matrix-container {
        display: grid;
        grid-template-columns: 72px minmax(0, 1fr) minmax(0, 1fr);
        grid-template-rows: 48px minmax(180px, 1fr) minmax(180px, 1fr);
        width: min(760px, 100%);
        min-height: 520px;
        box-sizing: border-box;
        margin: auto;
        padding: 18px;
        background: #f8fbfc;
        border: 1px solid #d8e1e7;
        border-radius: 14px;
        box-shadow: 0 12px 30px rgba(35, 55, 70, 0.12);
      }

      .axis-label {
        display: flex;
        align-items: center;
        justify-content: center;
        color: #334155;
        font-weight: 700;
      }

      .y-label {
        writing-mode: vertical-rl;
        text-orientation: upright;
        letter-spacing: 0.16em;
      }

      .y-label.business {
        color: #b45309;
      }

      .y-label.technical {
        color: #0f766e;
      }

      .x-label {
        font-size: 16px;
        letter-spacing: 0.12em;
      }

      .quadrant {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-width: 0;
        margin: 6px;
        padding: 28px 18px 22px;
        background: #fff;
        border: 2px solid #d7e1e6;
        border-radius: 8px;
        text-align: center;
        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease,
          transform 0.2s ease;
      }

      .quadrant:hover {
        border-color: #0f766e;
        box-shadow: 0 8px 18px rgba(15, 118, 110, 0.14);
        transform: translateY(-2px);
      }

      .icon {
        width: 44px;
        height: 44px;
        margin-bottom: 14px;
        stroke: #1f5f65;
        stroke-width: 1.5;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .badge {
        position: absolute;
        top: 12px;
        left: 14px;
        color: #fff;
        background: #1f5f65;
        padding: 3px 8px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 700;
      }

      .role {
        margin: 0;
        color: #172033;
        font-size: clamp(14px, 2vw, 18px);
        font-weight: 700;
        line-height: 1.55;
        overflow-wrap: anywhere;
      }

      .description {
        max-width: 260px;
        margin: 10px 0 0;
        color: #526273;
        font-size: 12px;
        line-height: 1.6;
        overflow-wrap: anywhere;
      }

      .corner-note {
        align-self: end;
        justify-self: start;
        color: #64748b;
        font-size: 11px;
        line-height: 1.4;
      }

      @media (max-width: 520px) {
        body {
          padding: 16px 8px;
        }

        .matrix-container {
          grid-template-columns: 42px minmax(0, 1fr) minmax(0, 1fr);
          grid-template-rows: 42px minmax(170px, 1fr) minmax(170px, 1fr);
          min-height: 420px;
          padding: 10px 6px 10px 4px;
        }

        .x-label {
          font-size: 13px;
          letter-spacing: 0;
        }

        .y-label {
          font-size: 13px;
        }

        .quadrant {
          margin: 4px;
          padding: 28px 8px 16px;
        }

        .icon {
          width: 34px;
          height: 34px;
          margin-bottom: 10px;
        }

        .role {
          font-size: 13px;
        }

        .description {
          margin-top: 8px;
          font-size: 11px;
          line-height: 1.5;
        }
      }
    </style>
  </head>
  <body>
    <div class="matrix-container">
      <div class="empty-corner"></div>
      <div class="axis-label x-label" style="grid-column: 2">［ アプリ ］</div>
      <div class="axis-label x-label" style="grid-column: 3">［ インフラ ］</div>

      <div class="axis-label y-label business" style="grid-row: 2">業務寄り（顧客）</div>
      <div class="quadrant" style="grid-column: 2; grid-row: 2">
        <!-- ① アプリ × 業務 -->
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <rect x="13" y="3" width="8" height="10" rx="1"></rect>
        </svg>
        <span class="badge">①</span>
        <p class="role">アプリケーションSE</p>
        <p class="description">顧客の業務課題を捉え、<br />必要な機能と事業価値を形にする。</p>
      </div>

      <div class="quadrant" style="grid-column: 3; grid-row: 2">
        <!-- ③ インフラ × 業務 -->
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path>
          <polyline points="8 14 11 11 14 14"></polyline>
          <line x1="11" y1="11" x2="11" y2="17"></line>
        </svg>
        <span class="badge">③</span>
        <p class="role">インフラSE</p>
        <p class="description">
          顧客の運用事情や制約を捉え、<br />安定して稼働する環境とプロセスを形にする。
        </p>
      </div>

      <div class="axis-label y-label technical" style="grid-row: 3">技術寄り（システム）</div>
      <div class="quadrant" style="grid-column: 2; grid-row: 3">
        <!-- ② アプリ × 技術 -->
        <svg class="icon" viewBox="0 0 24 24">
          <polyline points="16 18 22 12 16 6"></polyline>
          <polyline points="8 6 2 12 8 18"></polyline>
          <line x1="14" y1="4" x2="10" y2="20"></line>
        </svg>
        <span class="badge">②</span>
        <p class="role">アプリケーション(ソフトウェア)アーキテクト</p>
        <p class="description">
          機能要件の実現方式と共通ルールを設計し、<br />アプリの品質と整合性を担保する。
        </p>
      </div>

      <div class="quadrant" style="grid-column: 3; grid-row: 3">
        <!-- ④ インフラ × 技術 -->
        <svg class="icon" viewBox="0 0 24 24">
          <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
          <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
          <line x1="6" y1="6" x2="6.01" y2="6"></line>
          <line x1="6" y1="18" x2="6.01" y2="18"></line>
        </svg>
        <span class="badge">④</span>
        <p class="role">インフラアーキテクト</p>
        <p class="description">
          非機能要件の実現方式と基盤構成を設計し、<br />システムの安定性と拡張性を担保する。
        </p>
      </div>
    </div>
  </body>
</html>
